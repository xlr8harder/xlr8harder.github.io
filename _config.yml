title: xlr8harder
tagline: Writing, projects, and archives
description: "The personal site of xlr8harder: AI research projects, long-form essays, transcripts, fiction, and public archives."
url: "https://xlr8harder.github.io"
social:
  name: xlr8harder
  links:
    - https://github.com/xlr8harder
    - https://x.com/xlr8harder
    - https://huggingface.co/xlr8harder
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
markdown: kramdown
defaults:
  - scope:
      path: ""
    values:
      layout: "page"
      image: /assets/social-card.png
header_pages:
  - mindmeld-extended/index.md
  - archive/index.md
include:
  - .well-known
exclude:
  - AGENTS.md
  - archive/AGENTS.md
  - README.md
  - tools
